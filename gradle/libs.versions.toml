####################################################################################################
# TrueVault version catalog
#
# Rules for this file:
#  - Stable releases only. No alpha / beta / rc unless there is no stable alternative AND the
#    reason is documented inline.
#  - Versions here were resolved against the live Google/Maven metadata, not guessed.
#  - Android Gradle Plugin 9.x ships Kotlin support built in, so `org.jetbrains.kotlin.android`
#    must NOT be applied. The bundled Kotlin version is 2.3.21 and every Kotlin compiler plugin
#    below is pinned to exactly that version.
####################################################################################################

[versions]
# --- Build toolchain -----------------------------------------------------------------------------
agp = "9.3.1"                      # requires Gradle >= 9.5.0 (wrapper pins 9.6.1)
kotlin = "2.3.21"                  # must equal the Kotlin bundled inside AGP 9.3.1
ksp = "2.3.11"                     # KSP2 unified versioning
javaToolchain = "21"
jvmTarget = "17"

# --- Android SDK ---------------------------------------------------------------------------------
compileSdk = "37"
compileSdkMinor = "1"              # platforms;android-37.1
targetSdk = "37"
minSdk = "26"

# --- AndroidX / Compose --------------------------------------------------------------------------
androidxCore = "1.19.0"
androidxSplashscreen = "1.2.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
androidxDatastore = "1.2.1"
androidxRoom = "2.8.4"
androidxWork = "2.11.2"
androidxPaging = "3.5.0"
androidxBiometric = "1.1.0"        # 1.4.x is still alpha-only; 1.1.0 is the newest stable
androidxHiltNavigation = "1.4.0"
composeBom = "2026.06.01"

# --- DI / async / serialization ------------------------------------------------------------------
hilt = "2.60.1"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.7.1"

# --- Media / images ------------------------------------------------------------------------------
coil = "3.5.0"
media3 = "1.10.1"

# --- Crypto --------------------------------------------------------------------------------------
bouncycastle = "1.85"              # Argon2id (pure JVM, no NDK) + constant-time helpers

# --- Testing -------------------------------------------------------------------------------------
junit4 = "4.13.2"
truth = "1.4.5"
turbine = "1.2.1"
mockk = "1.14.11"
robolectric = "4.16.1"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"
androidxEspresso = "3.7.0"

[libraries]
# --- AndroidX core -------------------------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# --- Lifecycle -----------------------------------------------------------------------------------
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }

# --- Compose (versions come from the BOM) --------------------------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Navigation ----------------------------------------------------------------------------------
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "androidxNavigation" }

# --- DataStore -----------------------------------------------------------------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# --- Room ----------------------------------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "androidxRoom" }

# --- WorkManager / Paging / Biometric ------------------------------------------------------------
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "androidxPaging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "androidxPaging" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }

# --- Hilt ----------------------------------------------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigation" }

# --- Kotlin runtime ------------------------------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# --- Media / images ------------------------------------------------------------------------------
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

# --- Crypto --------------------------------------------------------------------------------------
bouncycastle-provider = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# --- Testing -------------------------------------------------------------------------------------
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }

# --- Plugin artifacts consumed by build-logic (compileOnly) --------------------------------------
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidx-room = { id = "androidx.room", version.ref = "androidxRoom" }

# TrueVault convention plugins (implemented in :build-logic:convention)
truevault-android-application = { id = "truevault.android.application" }
truevault-android-application-compose = { id = "truevault.android.application.compose" }
truevault-android-library = { id = "truevault.android.library" }
truevault-android-library-compose = { id = "truevault.android.library.compose" }
truevault-android-feature = { id = "truevault.android.feature" }
truevault-android-hilt = { id = "truevault.android.hilt" }
truevault-android-room = { id = "truevault.android.room" }
